
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>TRU Supply Chain Simulation</title>
      <meta name="description" content="Visualize global production capacity options with an interactive heat map, helping semiconductor companies like Kulicke &amp; Soffa make strategic location decisions." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (function(){
          var key = '__app_v';
          fetch('./version.json?_=' + Date.now(), { cache: 'no-store' })
            .then(function(r){ return r.json(); })
            .then(function(d){
              var prev = localStorage.getItem(key);
              if (prev && prev !== d.v) { localStorage.setItem(key, d.v); location.reload(); }
              else { localStorage.setItem(key, d.v); }
            })
            .catch(function(){});
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
